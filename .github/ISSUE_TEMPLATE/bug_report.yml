name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device or simulator
      placeholder: iPhone Duo simulator (iOS 27.1) / Galaxy Z Fold 6 (Android 16)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: react-native 0.88.1, react-native-foldable-kit 0.3.1
    validations:
      required: true
  - type: dropdown
    id: posture
    attributes:
      label: Posture
      options: [closed, flat, book, tabletop, other]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include what useFoldable() returned if you can.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or code to reproduce
